# The Julia environment of the examodelspower image. Tools pinned exactly; every
# transitive package is pinned by Manifest.toml, resolved by setup.jl against
# a General registry snapshot at least 7 days old (see docker/lock.sh).
[deps]
ExaModels = "1037b233-b668-4ce9-9b63-f9f681f55dd2"
ExaModelsPower = "2fff4b78-0b6c-428d-bac8-85ccea8c4bdf"
GridBenchExaModelsPower = "8df4befa-3bf1-4ba7-93bc-054535a02e76"
MadNLP = "2621e9c9-9eb4-46b1-8089-e8c72242dfb6"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"

[sources]
GridBenchExaModelsPower = {path = "GridBenchExaModelsPower"}   # the adapter's Julia half, compiled into the image

[compat]
julia = "=1.12.7"
ExaModels = "=0.9.7"        # the newest ExaModelsPower 0.3.1 accepts (0.9)
ExaModelsPower = "=0.3.1"   # the newest release in the registry snapshot
MadNLP = "=0.9.2"           # the newest these accept (0.10 needs a newer NLPModels); MUMPS 5.8.2 as its linear solver
PythonCall = "=0.9.35"      # exactly the version juliacall 0.9.35 requires
