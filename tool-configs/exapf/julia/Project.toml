# The Julia environment of the exapf image. Tools pinned exactly; every
# transitive package is pinned by Manifest.toml, resolved by setup.jl against
# a General registry snapshot at least 7 days old (see docker/lock.sh).
[deps]
ExaPF = "0cf0e50c-a82e-488f-ac7e-41ffdff1b8aa"
GridBenchExaPF = "64cc1256-c406-4d61-ad19-fdbc0383df50"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"

[sources]
GridBenchExaPF = {path = "GridBenchExaPF"}   # the adapter's Julia half, compiled into the image

[compat]
julia = "=1.12.7"
ExaPF = "=0.13.0"
PythonCall = "=0.9.35"    # exactly the version juliacall 0.9.35 requires
