# Dependencies of the gridoxide benchmark image. gridoxide itself is not
# installed from PyPI: its Linux wheels there are built for Python 3.9 only,
# and the MATPOWER reader and flat start this benchmark needs are newer than
# its last release. tool-configs/gridoxide/Dockerfile compiles it from a
# source tree at one commit instead. See adapters/gridoxide_adapter.py for how
# the tool is driven.
[project]
name = "grid-bench-gridoxide"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-timeout>=2.3",
]

# Only for compiling gridoxide in the Dockerfile's builder stage
# (`uv sync --only-group build`), so its build tool comes from this lockfile.
[dependency-groups]
build = [
    "maturin>=1.8",
]

[tool.uv]
package = false
exclude-newer = "P7D"
