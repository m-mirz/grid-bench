# Dependencies of the exapf_gpu benchmark image: the same as the exapf image
# (the Python harness plus juliacall). The Julia side (ExaPF.jl, CUDA.jl,
# CUDSS.jl) is pinned by julia/Project.toml and julia/Manifest.toml. See
# adapters/exapf_gpu_adapter.py for how it is driven.
[project]
name = "grid-bench-exapf-gpu"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-timeout>=2.3",
    "juliacall==0.9.35",
]

[tool.uv]
package = false
exclude-newer = "P7D"
