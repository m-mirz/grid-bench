# The Julia environment of the exapf_gpu image: exapf's (same ExaPF, same
# GridBenchExaPF, every shared package at the same version) plus CUDA.jl and
# CUDSS.jl, which activate ExaPF's CUDA extension. Tools pinned exactly;
# every transitive package is pinned by Manifest.toml, resolved by setup.jl
# against a General registry snapshot at least 7 days old (see docker/lock.sh).
[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
CUDSS = "45b445bb-4962-46a0-9369-b4df9d0f772e"
ExaPF = "0cf0e50c-a82e-488f-ac7e-41ffdff1b8aa"
GridBenchExaPF = "64cc1256-c406-4d61-ad19-fdbc0383df50"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"

# Only so that LocalPreferences.toml may set CUDA_Runtime_jll's preferences:
# Julia reads a package's preferences from a project that names it.
[extras]
CUDA_Runtime_jll = "76a88914-d11a-5bdc-97e0-2f5a05c973a2"

[sources]
GridBenchExaPF = {path = "../../exapf/julia/GridBenchExaPF"}   # the CPU image's, shared: one adapter, two backends

[compat]
julia = "=1.12.7"
CUDA = "=6.2.0"
CUDSS = "=0.8.0"
ExaPF = "=0.13.0"
PythonCall = "=0.9.35"    # exactly the version juliacall 0.9.35 requires
