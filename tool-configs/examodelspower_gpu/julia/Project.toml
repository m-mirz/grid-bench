# The Julia environment of the examodelspower_gpu image: examodelspower's
# (same ExaModelsPower, ExaModels, MadNLP and GridBenchExaModelsPower) plus
# MadNLPGPU, CUDA.jl and CUDSS.jl for ExaModels' CUDA backend and MadNLP's
# cuDSS solver. MadNLP 0.9, which ExaModelsPower 0.3.1 needs, takes at most
# MadNLPGPU 0.9, and that CUDA.jl 5 and CUDSS 0.6: an older CUDA stack than
# exapf_gpu's (CUDA.jl 6, CUDSS 0.8), with the same runtime
# (LocalPreferences.toml). Tools pinned exactly; every transitive package is
# pinned by Manifest.toml, resolved by setup.jl against a General registry
# snapshot at least 7 days old (see docker/lock.sh).
[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
CUDSS = "45b445bb-4962-46a0-9369-b4df9d0f772e"
ExaModels = "1037b233-b668-4ce9-9b63-f9f681f55dd2"
ExaModelsPower = "2fff4b78-0b6c-428d-bac8-85ccea8c4bdf"
GridBenchExaModelsPower = "8df4befa-3bf1-4ba7-93bc-054535a02e76"
MadNLP = "2621e9c9-9eb4-46b1-8089-e8c72242dfb6"
MadNLPGPU = "d72a61cc-809d-412f-99be-fd81f4b8a598"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"

# Only so that LocalPreferences.toml may set CUDA_Runtime_jll's preferences:
# Julia reads a package's preferences from a project that names it.
[extras]
CUDA_Runtime_jll = "76a88914-d11a-5bdc-97e0-2f5a05c973a2"

[sources]
GridBenchExaModelsPower = {path = "../../examodelspower/julia/GridBenchExaModelsPower"}   # the CPU image's, shared: one adapter, two backends

[compat]
julia = "=1.12.7"
CUDA = "=5.11.3"
CUDSS = "=0.6.5"        # as the snapshot resolved it with the rest (cuDSS 0.7.1)
ExaModels = "=0.9.7"
ExaModelsPower = "=0.3.1"
MadNLP = "=0.9.2"
MadNLPGPU = "=0.9.0"    # the newest MadNLP 0.9 takes
PythonCall = "=0.9.35"    # exactly the version juliacall 0.9.35 requires
