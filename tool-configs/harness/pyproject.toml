# The harness image: input preparation (cases/prep.py), the oracle's own
# tests, and report generation. No tool under test is installed here.
[project]
name = "grid-bench-harness"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "matplotlib>=3.10",
]

[tool.uv]
package = false
exclude-newer = "P7D"
