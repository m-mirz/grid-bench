# The harness image: input preparation (cases/prep.py, including the
# cimoxide MATPOWER -> CGMES conversion), the oracle's own tests, the
# conversion check, and report generation. No tool under test is installed here.
[project]
name = "grid-bench-harness"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-timeout>=2.3",
    "cimoxide==0.5.0",       # writes the MATPOWER -> CGMES conversion (cases/matpower_to_cgmes.py)
]

[tool.uv]
package = false
exclude-newer = "P7D"
# cimoxide 0.5.0 (2026-10-09) follows the API break of 0.4 (element dicts
# with "Class.attr" keys and string values); taken before the one-week rule
# allows it, at the maintainer's request, after checking that it writes
# every default converted case byte-identically to 0.3.3.
exclude-newer-package = { cimoxide = "2026-10-09T18:00:00Z" }
