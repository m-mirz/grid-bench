# The Julia environment of the juliagrid image. Tools pinned exactly; every
# transitive package is pinned by Manifest.toml, resolved by setup.jl against
# a General registry snapshot at least 7 days old (see docker/lock.sh).
[deps]
GridBenchJuliaGrid = "125d444e-dd51-461a-b182-a5140f83ec80"
Ipopt = "b6b21f68-93f8-5de0-b562-5493be1d77c9"
JuMP = "4076af6c-e467-56ae-b986-b466b2749572"
JuliaGrid = "040ba96c-7d3d-4d4a-931c-37903f53a565"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"

[sources]
GridBenchJuliaGrid = {path = "GridBenchJuliaGrid"}   # the adapter's Julia half, compiled into the image

[compat]
julia = "=1.12.7"
Ipopt = "=1.16.0"         # the PowerModels image's: Ipopt 3.14.19 (Ipopt_jll), MUMPS as its linear solver
JuMP = "=1.31.2"
JuliaGrid = "=0.6.2"
PythonCall = "=0.9.35"    # exactly the version juliacall 0.9.35 requires
