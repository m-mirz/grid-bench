# The Julia environment of the powermodels image. Tools pinned exactly; every
# transitive package is pinned by Manifest.toml, resolved by setup.jl against
# a General registry snapshot at least 7 days old (see docker/lock.sh).
[deps]
GridBenchPowerModels = "3f6b1c7e-2d4a-4c8e-9b1a-6e5d7c9a0f21"
Ipopt = "b6b21f68-93f8-5de0-b562-5493be1d77c9"
JuMP = "4076af6c-e467-56ae-b986-b466b2749572"
PowerModels = "c36e90e8-916a-50a6-bd94-075b64ef4655"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"

[sources]
GridBenchPowerModels = {path = "GridBenchPowerModels"}   # the adapter's Julia half, compiled into the image

[compat]
julia = "=1.12.7"
Ipopt = "=1.16.0"         # Ipopt 3.14.19 (Ipopt_jll), MUMPS as its linear solver
JuMP = "=1.31.2"
PowerModels = "=0.21.6"
PythonCall = "=0.9.35"    # exactly the version juliacall 0.9.35 requires
