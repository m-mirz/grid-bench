[project]
name = "grid-bench"
version = "0.1.0"
description = "Benchmark of power system analysis software: speed, graded by a tool-independent oracle"
requires-python = "==3.13.*"
license = "Apache-2.0"
# The harness and oracle need only these (oracle tests, case preparation).
# Tools are installed only in their images, from tool-configs/<tool>/uv.lock,
# so each tool's version is pinned in one place.
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-timeout>=2.3",
    "cimoxide==0.5.0",   # MATPOWER -> CGMES conversion (cases/matpower_to_cgmes.py)
]

[tool.uv]
package = false
# Never resolve a release younger than a week: a fresh release is not yet
# the version most users run, and a yanked one would poison the lockfile.
exclude-newer = "P7D"
# cimoxide 0.5.0 (2026-10-09) follows the API break of 0.4 (element dicts
# with "Class.attr" keys and string values); taken before the one-week rule
# allows it, at the maintainer's request, after checking that it writes
# every default converted case byte-identically to 0.3.3.
exclude-newer-package = { cimoxide = "2026-10-09T18:00:00Z" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["benchmarks", "tests"]
python_files = ["*_benchmark.py", "test_*.py"]
addopts = "-p no:cacheprovider --benchmark-columns=min,median,mean,stddev,rounds"
timeout = 1800
timeout_method = "signal"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
