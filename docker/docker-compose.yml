# Which benchmarks exist and how each runs. docker/run_benchmark.sh runs
# the services one at a time, never concurrently.
# Containers run as the invoking user (the scripts export HOST_UID/HOST_GID),
# so everything they write into the checkout stays owned by that user.
x-bench: &bench
  network_mode: none
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    GIT_SHA: ${GIT_SHA:-unknown}
  volumes:
    - ..:/bench:ro,z
    - ../results-docker:/output:z

# cgmes2pgm reads CGMES through a SPARQL endpoint: it gets a Fuseki sidecar on
# an internal network (no route out), instead of `network_mode: none`.
networks:
  fuseki:
    internal: true

services:
  fuseki:
    image: grid-bench/fuseki:latest
    networks: [fuseki]

  cgmes2pgm:
    image: grid-bench/cgmes2pgm:latest
    depends_on: [fuseki]
    networks: [fuseki]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      FUSEKI_URL: http://fuseki:3030
    volumes:
      - ..:/bench:ro,z
      - ../results-docker:/output:z
    command: pytest benchmarks/cgmes2pgm_benchmark.py --benchmark-json=/output/cgmes2pgm.json

  prep:
    image: grid-bench/harness:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ..:/bench:ro,z
      - ../data/.case-cache:/bench/data/.case-cache:z
    command: python -m cases.prep

  # pypowsybl's MATPOWER -> CGMES conversion needs pypowsybl, so it runs in
  # that image; the cimoxide conversion runs in `prep`.
  prep-pypowsybl:
    image: grid-bench/pypowsybl:latest
    network_mode: none
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ..:/bench:ro,z
      - ../data/.case-cache:/bench/data/.case-cache:z
    command: python -m cases.prep --family converted-pypowsybl

  conversion-check:
    <<: *bench
    image: grid-bench/harness:latest
    command: python -m oracle.check_conversion /output

  oracle-tests:
    <<: *bench
    image: grid-bench/harness:latest
    command: pytest tests -q

  reports:
    <<: *bench
    image: grid-bench/harness:latest
    volumes:
      - ..:/bench:ro,z
      - ../results-docker:/output:z
      - ../docs:/bench/docs:z
    command: python -m tools.generate_all /output

  pandapower:
    <<: *bench
    image: grid-bench/pandapower:latest
    command: pytest benchmarks/pandapower_benchmark.py --benchmark-json=/output/pandapower.json

  lightsim2grid:
    <<: *bench
    image: grid-bench/lightsim2grid:latest
    command: pytest benchmarks/lightsim2grid_benchmark.py --benchmark-json=/output/lightsim2grid.json

  pypsa:
    <<: *bench
    image: grid-bench/pypsa:latest
    command: pytest benchmarks/pypsa_benchmark.py --benchmark-json=/output/pypsa.json

  pgm:
    <<: *bench
    image: grid-bench/pgm:latest
    command: pytest benchmarks/pgm_benchmark.py --benchmark-json=/output/pgm.json

  pypowsybl:
    <<: *bench
    image: grid-bench/pypowsybl:latest
    command: pytest benchmarks/pypowsybl_benchmark.py --benchmark-json=/output/pypowsybl.json

  veragrid:
    <<: *bench
    image: grid-bench/veragrid:latest
    command: pytest benchmarks/veragrid_benchmark.py --benchmark-json=/output/veragrid.json
